# mission.yaml
# Static mission configuration for the Children of Israel Agent Swarm.
# Loaded at runtime by llm.py (model routing) and moses.py (SLA enforcement).

mission:
  name: "Children of Israel Agent Swarm"
  version: "1.0"
  description: >
    A hierarchical AI agent swarm governed by a three-tier law layer
    (Ten Commandments, 613 Commandments, Oral Law) and organized into
    12 tribal archetypes following the Jethro 5-tier orchestration model.

# ---------------------------------------------------------------------------
# SLAs
# ---------------------------------------------------------------------------
sla:
  moses_ruling_seconds: 300         # OL-004: Silence of Moses timeout
  tier1_response_seconds: 60
  tier2_response_seconds: 45
  tier3_response_seconds: 30
  tier4_response_seconds: 20
  hermes_fallback_seconds: 10       # time to wait before falling back from Hermes to tribal node

# ---------------------------------------------------------------------------
# Model policy classes
# ---------------------------------------------------------------------------
model_classes:
  root_judge:
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

  senior_judge:
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

  compliance:
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

  coordinator:
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

  leaf_executor:
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

  openrouter_reasoning:
    provider: "openrouter"
    model: "openrouter/auto"
    json_mode: true

tier_model_classes:
  root: "openrouter_reasoning"
  tier_1: "senior_judge"
  tier_2: "compliance"
  tier_3: "coordinator"
  tier_4: "leaf_executor"

tribe_model_classes:
  moses: "openrouter_reasoning"
  judah: "senior_judge"
  levi: "senior_judge"
  dan: "senior_judge"
  joseph: "senior_judge"
  simeon: "compliance"
  issachar: "coordinator"
  zebulun: "coordinator"
  asher: "coordinator"
  reuben: "leaf_executor"
  naphtali: "leaf_executor"
  gad: "leaf_executor"
  benjamin: "leaf_executor"

# ---------------------------------------------------------------------------
# Per-tribe runtime model routing.
# All tribes route to local Ollama (llama3.2) for local dev.
# The packaged default tests use the mock backend; live Ollama is opt-in.
# This block is retained for older callers; model_classes/tier_model_classes
# are the canonical agentic-os resolver path.
# ---------------------------------------------------------------------------
tribe_model_routing:

  # Tier 1 - Senior judges
  - tribe_id: "judah"
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

  - tribe_id: "levi"
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

  - tribe_id: "dan"
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

  - tribe_id: "joseph"
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

  # Tier 2 - Enforcement
  - tribe_id: "simeon"
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

  # Tier 3 - Mid-level workers
  - tribe_id: "issachar"
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

  - tribe_id: "zebulun"
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

  - tribe_id: "asher"
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

  # Tier 4 - Leaf executors
  - tribe_id: "reuben"
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

  - tribe_id: "naphtali"
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

  - tribe_id: "gad"
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

  - tribe_id: "benjamin"
    provider: "ollama"
    model: "llama3.2"
    json_mode: true

# ---------------------------------------------------------------------------
# Checkpointing
# ---------------------------------------------------------------------------
checkpointing:
  backend: "memory"   # Options: "memory" | "postgres" | "redis"
  postgres_url: null  # Set via POSTGRES_URL env var
  redis_url: null     # Set via REDIS_URL env var
